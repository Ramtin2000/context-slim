name: CI

on:
  push: { branches: [master] }
  pull_request:
  schedule:
    # Rates go stale at 90 days; catch it on a Monday, not in a launch thread.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=context_slim --cov-report=term-missing
      - name: performance (uninstrumented)
        # The timing assertions skip themselves under a coverage tracer, which
        # would otherwise measure the tracer rather than the code. Run them
        # once more with coverage off so the sub-5ms budget is still enforced.
        # Linux only: hosted macOS/Windows runners are too noisy for a
        # wall-clock budget, and a flaky perf gate gets ignored, not fixed.
        run: pytest -q --no-cov tests/test_performance.py
        if: matrix.os == 'ubuntu-latest'
      - name: no runtime dependencies
        # Zero runtime deps is the headline claim, so this check must fail
        # closed. The previous version grepped for `context-slim`, which stopped
        # being the distribution name at the rename to `ctx-slim` - pipdeptree
        # then printed nothing, exited 0, and the assertion passed on an empty
        # file. It enforced nothing for several commits. Hence the first line:
        # prove the package is actually there before asserting anything about it.
        run: |
          pip install pipdeptree
          pipdeptree -p ctx-slim --warn silence | tee /tmp/deps.txt
          grep -q '^ctx-slim==' /tmp/deps.txt \
            || { echo "::error::ctx-slim not found - this check is not looking at the real package"; exit 1; }
          test "$(grep -c '^  ' /tmp/deps.txt || true)" -eq 0 \
            || { echo "::error::ctx-slim has gained a runtime dependency"; exit 1; }
        shell: bash
        if: matrix.os == 'ubuntu-latest'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy --strict src/context_slim
